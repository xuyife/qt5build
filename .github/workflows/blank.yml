name: Build Qt 5.15.9
on: [push, workflow_dispatch]

jobs:
  # Windows x86_64
  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Build Qt
        shell: cmd
        run: |
          curl -L -o qt.tar.xz https://download.qt.io/archive/qt/5.15/5.15.9/single/qt-everywhere-opensource-src-5.15.9.tar.xz
          tar xf qt.tar.xz
          cd qt-everywhere-src-5.15.9
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          configure.bat -release -opensource -confirm-license -nomake examples -nomake tests -skip qtdeclarative -skip qtwebengine -prefix %CD%\build
          nmake
          nmake install
      - uses: actions/upload-artifact@v3
        with:
          name: qt5-windows-x64
          path: qt-everywhere-src-5.15.9/build

  # Linux x86_64
  linux-x64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1-mesa-dev libxcb-*-dev libx11-xcb-dev libxkbcommon-x11-dev python3
      - name: Build Qt
        run: |
          wget -q https://download.qt.io/archive/qt/5.15/5.15.9/single/qt-everywhere-opensource-src-5.15.9.tar.xz
          tar xf qt-everywhere-opensource-src-5.15.9.tar.xz
          cd qt-everywhere-src-5.15.9
          ./configure -release -opensource -confirm-license -nomake examples -nomake tests -skip qtdeclarative -skip qtwebengine -prefix $PWD/build
          make -j$(nproc)
          make install
      - uses: actions/upload-artifact@v3
        with:
          name: qt5-linux-x64
          path: qt-everywhere-src-5.15.9/build

  # macOS x86_64
  macos-x64:
    runs-on: macos-13  # 最后一代 Intel Mac runner
    steps:
      - uses: actions/checkout@v4
      - name: Build Qt
        run: |
          curl -O https://download.qt.io/archive/qt/5.15/5.15.9/single/qt-everywhere-opensource-src-5.15.9.tar.xz
          tar xf qt-everywhere-opensource-src-5.15.9.tar.xz
          cd qt-everywhere-src-5.15.9
          ./configure -release -opensource -confirm-license -nomake examples -nomake tests -skip qtdeclarative -skip qtwebengine -prefix $PWD/build -- -DCMAKE_OSX_ARCHITECTURES=x86_64
          make -j$(sysctl -n hw.logicalcpu)
          make install
      - uses: actions/upload-artifact@v3
        with:
          name: qt5-macos-x64
          path: qt-everywhere-src-5.15.9/build

  # macOS arm64
  macos-arm64:
    runs-on: macos-14  # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4
      - name: Build Qt
        run: |
          curl -O https://download.qt.io/archive/qt/5.15/5.15.9/single/qt-everywhere-opensource-src-5.15.9.tar.xz
          tar xf qt-everywhere-opensource-src-5.15.9.tar.xz
          cd qt-everywhere-src-5.15.9
          ./configure -release -opensource -confirm-license -nomake examples -nomake tests -skip qtdeclarative -skip qtwebengine -prefix $PWD/build -- -DCMAKE_OSX_ARCHITECTURES=arm64
          make -j$(sysctl -n hw.logicalcpu)
          make install
      - uses: actions/upload-artifact@v3
        with:
          name: qt5-macos-arm64
          path: qt-everywhere-src-5.15.9/build
